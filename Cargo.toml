[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.89"
repository = "https://github.com/NEKO-CwC/nekorisu-server"
publish = false

# Smaller debug builds: the target directory gets big with tonic, sqlx and reqwest.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
