[package]
name = "nekorisu-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.2"
hex = "0.4.3"
nekorisu-storage = { version = "0.1.0", path = "../storage" }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["formatting"] }

[dev-dependencies]
dav-server = "0.12.0"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
