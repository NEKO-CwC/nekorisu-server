[package]
name = "nekorisu-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.2"
httpdate = "1.0.3"
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time"] }
url = "2.5.9"

[dev-dependencies]
axum = "0.8.9"
dav-server = "0.12.0"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-util = "0.1.21"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
tower = "0.5.3"
