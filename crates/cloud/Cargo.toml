[package]
name = "nekorisu-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.2"
hex = "0.4.3"
nekorisu = { path = "../../../nekorisu" }
prost = "0.14.6"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros", "fs"] }
tokio-stream = "0.1.19"
toml = "1.2.2"
tonic = { version = "0.14.9", features = ["tls-ring"] }
tonic-prost = "0.14.9"
tracing = "0.1.44"
url = "2.5.9"

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.9"

[dev-dependencies]
base64 = "0.23.1"
hex = "0.4.3"
prost-types = "0.14.6"
protox = "0.10.0"
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
