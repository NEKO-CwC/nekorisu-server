[package]
name = "nekorisu-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.2"
futures = "0.3.34"
hex = "0.4.3"
mime_guess = "2.0.5"
nekorisu = { path = "../../../nekorisu" }
nekorisu-archive = { version = "0.1.0", path = "../archive" }
nekorisu-cloud = { version = "0.1.0", path = "../cloud" }
nekorisu-export = { version = "0.1.0", path = "../export" }
nekorisu-storage = { version = "0.1.0", path = "../storage" }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rust-embed = "8.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"

[dev-dependencies]
http-body-util = "0.1.5"
nekorisu-testkit = { path = "../testkit" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
