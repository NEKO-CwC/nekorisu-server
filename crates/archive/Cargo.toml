[package]
name = "nekorisu-archive"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.2"
futures = "0.3.34"
nekorisu-storage = { version = "0.1.0", path = "../storage" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.54.1", features = ["sync", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
futures = "0.3.34"
nekorisu-testkit = { path = "../testkit" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
