apiVersion: v1
kind: Service
metadata:
  name: nekorisu-server
  namespace: nekorisu
  labels:
    app.kubernetes.io/name: nekorisu-server
spec:
  selector:
    app.kubernetes.io/name: nekorisu-server
  ports:
    - name: http
      port: 8080
      targetPort: http
    # The device protocol (gRPC, plain HTTP/2), published by 41-ingress-grpc.yaml.
    - name: grpc
      port: 7070
      targetPort: grpc
