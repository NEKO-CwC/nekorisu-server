# Copy to docker-compose.yml and fill in. Everything is set with environment
# variables; secrets can be given as files with the
# _FILE variants.
#
# Build the image first (the client repository is a second build context):
#     docker build --build-context nekorisu=../nekorisu -t nekorisu-server .
services:
  nekorisu-server:
    image: nekorisu-server
    restart: unless-stopped
    ports:
      # The panel and MCP: only on this machine; put a reverse proxy with TLS in front to reach it elsewhere.
      - "127.0.0.1:8080:8080"
      # The device protocol (gRPC). Plain HTTP/2 here: terminate TLS in a reverse proxy that
      # speaks HTTP/2 to the backend, or give NEKORISU_GRPC_TLS_CERT_FILE and _KEY_FILE.
      - "7070:7070"
    environment:
      NEKORISU_WEBDAV_URL: https://dav.example.com/dav
      NEKORISU_WEBDAV_USER: me
      NEKORISU_WEBDAV_PASSWORD_FILE: /run/secrets/webdav_password
      NEKORISU_DEVICE_TOKEN_FILE: /run/secrets/device_token
      NEKORISU_MCP_TOKEN_FILE: /run/secrets/mcp_token
      # The address devices use, for the connect command shown in the panel.
      NEKORISU_PUBLIC_URL: https://nekorisu.example.com
      # Set to true when the panel is served over HTTPS.
      NEKORISU_COOKIE_SECURE: "false"
    volumes:
      # The database and the config signing key. Back this up: without the key,
      # every device must be pointed at the server again.
      - nekorisu-data:/data
      # What to hand to devices; see config-example/.
      - ./config:/config:ro
    secrets:
      - webdav_password
      - device_token
      - mcp_token

volumes:
  nekorisu-data:

secrets:
  webdav_password:
    file: ./secrets/webdav_password
  device_token:
    file: ./secrets/device_token
  mcp_token:
    file: ./secrets/mcp_token
