# Copy to docker-compose.yml and fill in. Everything is set with environment
# variables; secrets can be given as files with the
# _FILE variants.
#
# Build the image first (the client repository is a second build context):
#     docker build --build-context nekorisu=../nekorisu -t nekorisu-server .
services:
  nekorisu-server:
    image: nekorisu-server
    restart: unless-stopped
    ports:
      # The panel and MCP: only on this machine; put a reverse proxy with TLS in front to reach it elsewhere.
      - "127.0.0.1:8080:8080"
      # The device protocol (gRPC). Plain HTTP/2 here: terminate TLS in a reverse proxy that
      # speaks HTTP/2 to the backend, or give NEKORISU_GRPC_TLS_CERT_FILE and _KEY_FILE.
      - "7070:7070"
    environment:
      NEKORISU_WEBDAV_URL: https://dav.example.com/dav
      NEKORISU_WEBDAV_USER: me
      NEKORISU_WEBDAV_PASSWORD_FILE: /run/secrets/webdav_password
      NEKORISU_DEVICE_TOKEN_FILE: /run/secrets/device_token
      # The address people and agents reach the panel and MCP at (with the port if it is not 443).
      # MCP is on only when this is set: agents sign in with OAuth against it
      # (`claude mcp login` / `codex mcp login`), there is no MCP token.
      NEKORISU_PUBLIC_URL: https://nekorisu.example.com
      # Where devices reach the device protocol (port 7070 above), when that is not
      # NEKORISU_PUBLIC_URL. It goes into the connect command on /connect and the panel.
      # NEKORISU_DEVICE_URL: https://nekorisu.example.com:7070
      # /connect and /.well-known/nekorisu: public notes on how to connect a device and an
      # agent, and which settings are still missing. Nothing secret is on them; the storage
      # address and user name only with the second switch (for a server on a private network).
      # NEKORISU_CONNECT_PAGE: "true"
      # NEKORISU_CONNECT_SHOW_STORAGE: "false"
      # Set to true when the panel is served over HTTPS.
      NEKORISU_COOKIE_SECURE: "false"
      # Behind a reverse proxy: the addresses its connections come from, as comma-separated ranges
      # (for a proxy on this machine, the Docker network's gateway, usually in 172.16.0.0/12).
      # Only from these are X-Real-IP / X-Forwarded-For believed, so that wrong passwords are
      # counted per client and not all as the proxy. Empty: the connecting address is the client.
      # NEKORISU_TRUSTED_PROXIES: 172.16.0.0/12
      # When this machine's DNS is a fake-IP proxy (sing-box, Clash: every outside name is
      # 198.18.x.x), look up the hosts of agents' client metadata documents through DNS over
      # HTTPS (RFC 8484) instead. The host must be an IP address.
      # NEKORISU_DNS_OVER_HTTPS: https://1.1.1.1/dns-query
    volumes:
      # The database and the config signing key. Back this up: without the key,
      # every device must be pointed at the server again.
      - nekorisu-data:/data
      # What to hand to devices; see config-example/.
      - ./config:/config:ro
    secrets:
      - webdav_password
      - device_token

volumes:
  nekorisu-data:

secrets:
  webdav_password:
    file: ./secrets/webdav_password
  device_token:
    file: ./secrets/device_token
